<script>
(function(){
  const $=s=>document.querySelector(s);
  const RAWDATA=document.getElementById("faq-data").textContent;let hsh=0;for(let i=0;i<RAWDATA.length;i++){hsh=(hsh*31+RAWDATA.charCodeAt(i))|0;}
  const STORE="baiten-faq-edits-"+hsh;
  const SEED=JSON.parse(document.getElementById("faq-data").textContent);
  let items=SEED, cat="all", editingId=null, dirty=false;
  try{const s=localStorage.getItem(STORE); if(s){items=JSON.parse(s); dirty=true;}}catch(e){}

  // 検索用の正規化（全角半角・カタカナ/ひらがな・記号のゆれを吸収）
  function norm(s){
    return String(s||"").normalize("NFKC").toLowerCase()
      .replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
      .replace(/[\s・\-ー－_、。,.!?！？「」()（）\/／]/g,"");
  }
  function score(it,terms){
    const t=norm(it.title), a=norm(it.answer), kws=(it.keywords||[]).concat(String(it.yomi||"").split(/\s+/)).map(norm);
    let total=0;
    for(const q of terms){
      let s=0;
      if(t.includes(q)) s+=5;
      for(const k of kws){ if(!k) continue; if(k===q) s+=6; else if(k.includes(q)) s+=3; else if(q.length>=2&&k.length>=2&&q.includes(k)) s+=2; }
      if(a.includes(q)) s+=1;
      if(!s) return 0;
      total+=s;
    }
    return total;
  }
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function hl(text,raw){
    let h=esc(text);
    for(const w of raw.split(/\s+/).filter(Boolean)){
      const re=new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
      h=h.replace(re,m=>"<mark>"+m+"</mark>");
    }
    return h;
  }
  const catLabel={customer:"お客様対応",staff:"スタッフ業務"};

  function render(){
    $("#dirty").hidden=!dirty;
    const raw=$("#q").value.trim();
    $("#clear").hidden=!raw;
    const terms=raw.split(/\s+/).map(norm).filter(Boolean);
    let rows=items.filter(it=>cat==="all"||(cat==="todo"?!(it.answer||"").trim():it.cat===cat));
    if(terms.length) rows=rows.map(it=>({it,s:score(it,terms)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.it);
    $("#count").textContent=terms.length?`「${raw}」の検索結果：${rows.length}件`:`全${rows.length}件`;
    const list=$("#list");
    if(!rows.length){
      list.innerHTML=`<div class="empty-state"><strong>${terms.length?"該当する項目が見つかりませんでした":"この区分の項目はありません"}</strong>
        <span>別の言い方（例：「返金」→「お金」「キャンセル」）でも試してみてください。<br>それでも無い場合は、聞かれた内容を売店リーダーに伝えて、項目を追加してもらいましょう。</span></div>`;
      return;
    }
    const open=terms.length&&rows.length<=3;
    list.innerHTML=rows.map(it=>{
      const empty=!(it.answer||"").trim();
      return `<details class="card" ${open?"open":""}>
        <summary><span class="tag ${it.cat}">${catLabel[it.cat]||"その他"}</span><span class="ttl">${hl(it.title,raw)}</span>${empty?'<span class="todo">回答未記入</span>':""}</summary>
        <div class="body">
          ${empty?`<div class="answer empty">まだ回答が書かれていません。わかる人に確認してください。${it.hint?"\n\n書く内容の例："+esc(it.hint):""}</div>`:`<div class="answer">${hl(it.answer,raw)}</div>`}
          <div class="kws">${(it.keywords||[]).map(k=>`<span>${esc(k)}</span>`).join("")}</div>
          <div class="foot"><span>${it.updatedAt?"最終更新："+esc(it.updatedAt):""}</span><button class="btn" type="button" data-edit="${esc(it.id)}">編集</button></div>
        </div></details>`;
    }).join("");
    list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));
  }

  function persist(){
    dirty=true;
    try{localStorage.setItem(STORE,JSON.stringify(items));}catch(e){toast("この端末には一時保存できません。ファイルに保存してください。");}
    render();
  }
  function openEditor(id){
    editingId=id||null;
    const it=items.find(x=>x.id===id)||{cat:"customer",title:"",keywords:[],answer:"",hint:""};
    $("#editor").innerHTML=`<form class="edit" id="ef">
      <strong>${id?"項目を編集":"新しい項目を追加"}</strong>
      <label>区分<select id="f-cat"><option value="customer">お客様対応</option><option value="staff">スタッフ業務</option></select></label>
      <label>タイトル<input id="f-title" value="${esc(it.title)}" placeholder="例：レシートの再発行はできますか"></label>
      <label>キーワード<span class="note">カンマ（,）か「、」で区切って入力。言い換え・略語・ひらがなも入れると検索に引っかかりやすくなります。</span>
        <input id="f-kw" value="${esc((it.keywords||[]).join(", "))}" placeholder="例：レシート, 領収書, 再発行, もう一回"></label>
      <label>回答・手順<textarea id="f-ans" placeholder="${esc(it.hint?"書く内容の例："+it.hint:"手順は 1. 2. 3. と番号をつけると読みやすくなります")}">${esc(it.answer||"")}</textarea></label>
      <div class="row">${id?'<button class="btn danger" type="button" id="f-del">削除</button>':""}<span style="flex:1"></span><button class="btn" type="button" id="f-cancel">キャンセル</button><button class="btn primary" type="submit">保存</button></div>
    </form>`;
    $("#f-cat").value=it.cat||"customer";
    $("#f-cancel").onclick=closeEditor;
    if(id){let armed=false;$("#f-del").onclick=e=>{
      if(!armed){armed=true;e.target.textContent="本当に削除する";return;}
      items=items.filter(x=>x.id!==id);closeEditor();persist();toast("削除しました");
    };}
    $("#ef").onsubmit=e=>{
      e.preventDefault();
      const d=new Date();
      const data={cat:$("#f-cat").value,title:$("#f-title").value.trim(),
        keywords:$("#f-kw").value.split(/[,、，]/).map(s=>s.trim()).filter(Boolean),
        answer:$("#f-ans").value.trim(),updatedAt:`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`};
      if(!data.title){toast("タイトルを入力してください");return;}
      if(editingId) items=items.map(x=>x.id===editingId?{...x,...data}:x);
      else items=[...items,{id:"n"+Date.now(),hint:"",...data}];
      closeEditor();persist();toast("保存しました（この端末）");
    };
    $("#editor").scrollIntoView({behavior:"smooth",block:"start"});
    $("#f-title").focus();
  }
  function closeEditor(){$("#editor").innerHTML="";editingId=null;}

  // 編集内容を埋め込んだ新しいHTMLファイルを作る
  $("#saveFileBtn").onclick=()=>{
    const html="<!DOCTYPE html>\n"+document.documentElement.outerHTML
      .replace(/(<script id="faq-data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+JSON.stringify(items).replace(/</g,"\\u003c")+b)
      .replace(/<div class="toast"[\s\S]*?<\/div>/,"");
    // 保存したファイルは編集状態を持たない状態で書き出す
    const blob=new Blob([html],{type:"text/html"});
    const a=document.createElement("a");const d=new Date();
    a.href=URL.createObjectURL(blob);
    a.download=`売店お助けFAQ_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.html`;
    document.body.appendChild(a);a.click();a.remove();
    toast("ファイルを保存しました。他の端末に配ってください。");
  };
  let armedReset=false;
  $("#resetBtn").onclick=e=>{
    if(!armedReset){armedReset=true;e.target.textContent="本当に取り消す";return;}
    try{localStorage.removeItem(STORE);}catch(err){}
    items=SEED;dirty=false;armedReset=false;e.target.textContent="編集を取り消す";render();toast("ファイルの内容に戻しました");
  };

  let tt;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800);}

  $("#q").addEventListener("input",render);
  $("#clear").onclick=()=>{$("#q").value="";render();$("#q").focus();};
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    cat=c.dataset.cat;document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===c)));render();
  });
  $("#addBtn").onclick=()=>openEditor(null);
  render();
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
